name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-procgroups:
    name: ProCGroups
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-procgroups
      library: ProCGroups

  library-valuedfieldtheory:
    name: ValuedFieldTheory
    needs: library-procgroups
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-valuedfieldtheory
      library: ValuedFieldTheory

  library-galoiscohomology:
    name: GaloisCohomology
    needs: library-valuedfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-galoiscohomology
      library: GaloisCohomology

  library-schemetheory:
    name: SchemeTheory
    needs: library-galoiscohomology
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-schemetheory
      library: SchemeTheory

  library-classfieldtheory-algebra:
    name: ClassFieldTheory.Algebra
    needs: library-schemetheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-algebra
      library: ClassFieldTheory.Algebra

  library-classfieldtheory-abstractclassfieldtheory:
    name: ClassFieldTheory.AbstractClassFieldTheory
    needs: library-classfieldtheory-algebra
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-abstractclassfieldtheory
      library: ClassFieldTheory.AbstractClassFieldTheory

  library-classfieldtheory-localfieldtheory:
    name: ClassFieldTheory.LocalFieldTheory
    needs: library-classfieldtheory-abstractclassfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-localfieldtheory
      library: ClassFieldTheory.LocalFieldTheory

  library-classfieldtheory-ramificationtheory:
    name: ClassFieldTheory.RamificationTheory
    needs: library-classfieldtheory-localfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-ramificationtheory
      library: ClassFieldTheory.RamificationTheory

  library-classfieldtheory-lubintate:
    name: ClassFieldTheory.LubinTate
    needs: library-classfieldtheory-ramificationtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-lubintate
      library: ClassFieldTheory.LubinTate

  library-classfieldtheory-algebraicnumbertheory:
    name: ClassFieldTheory.AlgebraicNumberTheory
    needs: library-classfieldtheory-lubintate
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-algebraicnumbertheory
      library: ClassFieldTheory.AlgebraicNumberTheory

  library-classfieldtheory-algebraicfunctionfieldtheory:
    name: ClassFieldTheory.AlgebraicFunctionFieldTheory
    needs: library-classfieldtheory-algebraicnumbertheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-algebraicfunctionfieldtheory
      library: ClassFieldTheory.AlgebraicFunctionFieldTheory

  library-classfieldtheory-kummertheory:
    name: ClassFieldTheory.KummerTheory
    needs: library-classfieldtheory-algebraicfunctionfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-kummertheory
      library: ClassFieldTheory.KummerTheory

  library-classfieldtheory-localclassfieldtheory-classformation:
    name: ClassFieldTheory.LocalClassFieldTheory.ClassFormation
    needs: library-classfieldtheory-kummertheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-localclassfieldtheory-classformation
      library: ClassFieldTheory.LocalClassFieldTheory.ClassFormation

  library-classfieldtheory-localclassfieldtheory-lubintateapplication:
    name: ClassFieldTheory.LocalClassFieldTheory.LubinTateApplication
    needs: library-classfieldtheory-localclassfieldtheory-classformation
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-localclassfieldtheory-lubintateapplication
      library: ClassFieldTheory.LocalClassFieldTheory.LubinTateApplication

  library-classfieldtheory-localclassfieldtheory-finite:
    name: ClassFieldTheory.LocalClassFieldTheory.Finite
    needs: library-classfieldtheory-localclassfieldtheory-lubintateapplication
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-localclassfieldtheory-finite
      library: ClassFieldTheory.LocalClassFieldTheory.Finite

  library-classfieldtheory-localclassfieldtheory:
    name: ClassFieldTheory.LocalClassFieldTheory
    needs: library-classfieldtheory-localclassfieldtheory-finite
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-localclassfieldtheory
      library: ClassFieldTheory.LocalClassFieldTheory

  library-classfieldtheory-globalclassfieldtheory:
    name: ClassFieldTheory.GlobalClassFieldTheory
    needs: library-classfieldtheory-localclassfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-globalclassfieldtheory
      library: ClassFieldTheory.GlobalClassFieldTheory

  library-classfieldtheory-kroneckerweber:
    name: ClassFieldTheory.KroneckerWeber
    needs: library-classfieldtheory-globalclassfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory-kroneckerweber
      library: ClassFieldTheory.KroneckerWeber

  library-classfieldtheory:
    name: ClassFieldTheory
    needs: library-classfieldtheory-kroneckerweber
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-classfieldtheory
      library: ClassFieldTheory

  library-algebraiccurves:
    name: AlgebraicCurves
    needs: library-classfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-algebraiccurves
      library: AlgebraicCurves

  library-etalefundamentalgroups:
    name: EtaleFundamentalGroups
    needs: library-algebraiccurves
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-etalefundamentalgroups
      library: EtaleFundamentalGroups

  library-etalecohomology:
    name: EtaleCohomology
    needs: library-etalefundamentalgroups
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-etalecohomology
      library: EtaleCohomology

  library-abelianvarieties:
    name: AbelianVarieties
    needs: library-etalecohomology
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-abelianvarieties
      library: AbelianVarieties

  library-jacobianvarieties:
    name: JacobianVarieties
    needs: library-abelianvarieties
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-jacobianvarieties
      library: JacobianVarieties

  library-yamaguchi26abfaithfulgalois:
    name: Yamaguchi26AbfaithfulGalois
    needs: library-jacobianvarieties
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-yamaguchi26abfaithfulgalois
      library: Yamaguchi26AbfaithfulGalois

  library-anabeliangeometry:
    name: AnabelianGeometry
    needs: library-yamaguchi26abfaithfulgalois
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: library-anabeliangeometry
      library: AnabelianGeometry

  all:
    name: Nyll.All and Nyll
    needs: library-anabeliangeometry
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: all
      target: +Nyll.All

  verify:
    name: NanoDa and Lean kernel replay
    needs: all
    if: github.event.repository.private == false
    uses: ./.github/workflows/proof-check.yml

  publish-cache:
    name: Publish verified Lean cache
    needs: verify
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/cache-release.yml
    with:
      cache-kind: modern
      cache-prefix: proof-build-v4
