name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

# Private pushes install the workflow but do not consume hosted build minutes.
# Run manually while private; ordinary push/PR builds begin after publication.
jobs:
  depth1-procgroups:
    name: Nyll.ProCGroups.All
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1-procgroups
      target: +Nyll.ProCGroups.All

  depth1-valuedfieldtheory:
    name: Nyll.ValuedFieldTheory.All
    needs: depth1-procgroups
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1-valuedfieldtheory
      target: +Nyll.ValuedFieldTheory.All

  depth1-galoiscohomology:
    name: Nyll.GaloisCohomology.All
    needs: depth1-valuedfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1-galoiscohomology
      target: +Nyll.GaloisCohomology.All

  depth1-schemetheory:
    name: Nyll.SchemeTheory.All
    needs: depth1-galoiscohomology
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1-schemetheory
      target: +Nyll.SchemeTheory.All

  depth2-classfieldtheory:
    name: Nyll.ClassFieldTheory.All
    needs: depth1-schemetheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-classfieldtheory
      target: +Nyll.ClassFieldTheory.All

  depth2-algebraiccurves:
    name: Nyll.AlgebraicCurves.All
    needs: depth2-classfieldtheory
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-algebraiccurves
      target: +Nyll.AlgebraicCurves.All

  depth2-etalefundamentalgroups:
    name: Nyll.EtaleFundamentalGroups.All
    needs: depth2-algebraiccurves
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-etalefundamentalgroups
      target: +Nyll.EtaleFundamentalGroups.All

  depth2-etalecohomology:
    name: Nyll.EtaleCohomology.All
    needs: depth2-etalefundamentalgroups
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2-etalecohomology
      target: +Nyll.EtaleCohomology.All

  depth3-jacobianvarieties:
    name: Nyll.JacobianVarieties.All
    needs: depth2-etalecohomology
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth3-jacobianvarieties
      target: +Nyll.JacobianVarieties.All

  depth3-anabeliangeometry:
    name: Nyll.AnabelianGeometry.All
    needs: depth3-jacobianvarieties
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth3-anabeliangeometry
      target: +Nyll.AnabelianGeometry.All

  all:
    name: Nyll.All
    needs: depth3-anabeliangeometry
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: all
      target: +Nyll.All
