name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  depth1:
    name: Import depth 1
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth1

  depth2:
    name: Import depth 2
    needs: depth1
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth2

  depth3:
    name: Import depth 3
    needs: depth2
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: depth3

  all:
    name: Nyll.All and Nyll
    needs: depth3
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/library-stage.yml
    with:
      stage: all
      target: +Nyll.All
