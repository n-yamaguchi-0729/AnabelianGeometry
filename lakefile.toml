enableArtifactCache = false

name = "AnabelianGeometry"
version = "0.1.0-dev"
buildDir = ".lake/build"
keywords = ["math"]
defaultTargets = ["All"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
linter.unusedVariables = true
linter.missingDocs = true
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

# All sources share one library configuration and the package-wide checks.
[[lean_lib]]
name = "All"
srcDir = "Lean4"
globs = [
  "All",
  "ProCGroups.+",
  "ValuedFieldTheory.+",
  "GaloisCohomology.+",
  "SchemeTheory.+",
  "ClassFieldTheory.+",
  "AlgebraicCurves.+",
  "EtaleFundamentalGroups.+",
  "EtaleCohomology.+",
  "JacobianVarieties.+",
  "AnabelianGeometry.+",
]
